testbed:
  name: GNS3 Test Topology
  credentials:
    default:
      password: cisco
      username: cisco
    enable:
      password: cisco

devices:
  rtr1:
    connections:
      cli:
        ip: 192.168.99.1
        protocol: ssh
        command: "ssh -v 192.168.99.1 -o HostKeyAlgorithms=+ssh-rsa -o KexAlgorithms=+diffie-hellman-group14-sha1 -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null"
    os: ios
    type: ios
    custom:
      version: "15.9"

topology:
  rtr1:
    interfaces:
      Loopback0:
        ipv4: 1.1.1.1/32
        type: loopback
